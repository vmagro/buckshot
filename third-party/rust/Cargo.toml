[workspace]

[package]
# Pseudo-package whose dependencies are imported and buckified by reindeer --
# see reindeer.toml. Not a real crate of its own.
name = "buckshot-third-party-rust"
version = "0.0.0"
edition = "2021"
publish = false

# Dummy target to keep Cargo happy (a package can't be all dependencies).
[[bin]]
name = "top"
path = "top/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6.2", features = ["derive"] }
flate2 = "1"
maplit = "1.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_starlark = "0.1"
sha2 = "0.10"
tar = "0.4"
toml = "1.1.3"

[patch.crates-io]
