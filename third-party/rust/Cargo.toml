[workspace]

[package]
# Pseudo-package whose dependencies are imported and buckified by reindeer --
# see reindeer.toml. Not a real crate of its own.
name = "buckshot-third-party-rust"
version = "0.0.0"
edition = "2021"
publish = false

# Dummy target to keep Cargo happy (a package can't be all dependencies).
[[bin]]
name = "top"
path = "top/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6.2", features = ["derive"] }
indicatif = "0.18"
maplit = "1.0.2"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "=0.17.5" # pinned to match fixups/ring/fixups.toml's version-gated cxx_library rules
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_starlark = "0.1"
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.3"

[patch.crates-io]
