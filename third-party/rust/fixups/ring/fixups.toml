buildscript.run = false

# Generate a C/C++ build rule for all the C code
#
# Every slice below sets:
# - `target_compatible_with`: each slice is single-platform (its asm only
#   assembles for that arch/os), so foreign slices must be skipped rather
#   than built -- without this, `buck2 build //...` tries to build e.g.
#   the win-msvc slice on macOS and fails.
# - `preferred_linkage = "static"`: nothing may link these shared. The ARM
#   asm references `OPENSSL_armcap_P`, which ring 0.17 defines in Rust
#   (`src/cpu/arm.rs`), so a standalone `.so` link fails on macOS (Linux
#   tolerates the undefined symbol, which is why this only bites here).
#   Static archives don't link, and rust consumers use the pic archive,
#   so the symbol resolves at the final binary link as intended.

# --target=x86_64-unknown-linux-gnu is needed because the NativeLink worker
# that actually builds linux-x86_64 targets runs natively as aarch64 (see
# platforms/exec/Dockerfile) -- clang's default target would otherwise be the
# worker's own native arch, producing object files that don't link with the
# rest of the (genuinely x86_64) build. This applies to both .c and .S
# sources (unlike the toolchain's per-language-extension compiler flags,
# `cxx_library.compiler_flags` is added unconditionally for every source
# extension -- see buck2-prelude/cxx/compile.bzl's make_target_argsfile).
[['cfg(all(target_arch = "x86_64", target_os = "linux"))'.cxx_library]]
name = "ring-c-asm-elf-x86_84"
preferred_linkage = "static"
target_compatible_with = ["prelude//os/constraints:linux", "prelude//cpu/constraints:x86_64"]
srcs = ["crypto/**/*.c", "pregenerated/*x86_64*-elf.S"]
headers = [
    "include/**/*.h",
    "crypto/**/*.h",
    "third_party/**/*.h",
    "crypto/**/*.inl",
]
include_paths = ["include"]
compiler_flags = ["-Wno-error", "--target=x86_64-unknown-linux-gnu"]

['cfg(all(version = "=0.17.5", target_arch = "x86_64", target_os = "linux"))'.env]
RING_CORE_PREFIX = "ring_core_0_17_5_"
[['cfg(all(version = "=0.17.5", target_arch = "x86_64", target_os = "linux"))'.cxx_library]]
name = "ring-c-asm-elf-x86_84"
preferred_linkage = "static"
target_compatible_with = ["prelude//os/constraints:linux", "prelude//cpu/constraints:x86_64"]
srcs = [
    "crypto/**/*.c",
    "pregenerated/*x86_64*-elf.S",
    "third_party/fiat/asm/fiat_curve25519_adx_mul.S",
    "third_party/fiat/asm/fiat_curve25519_adx_square.S",
]
headers = [
    "include/**/*.h",
    "crypto/**/*.h",
    "third_party/**/*.h",
    "crypto/**/*.inl",
]
include_paths = ["include"]
compiler_flags = ["-Wno-error", "--target=x86_64-unknown-linux-gnu"]
fixup_include_paths = ["include"]

[['cfg(all(target_arch = "aarch64", target_os = "linux"))'.cxx_library]]
name = "ring-c-asm-elf-aarch64"
preferred_linkage = "static"
target_compatible_with = ["prelude//os/constraints:linux", "prelude//cpu/constraints:arm64"]
srcs = [
    "crypto/**/*.c",
    "pregenerated/*armv8*-linux64.S",
    "pregenerated/*armx*-linux64.S",
]
headers = [
    "include/**/*.h",
    "crypto/**/*.h",
    "third_party/**/*.h",
    "crypto/**/*.inl",
]
exclude = ["crypto/cpu_intel.c"]
include_paths = ["include"]
compiler_flags = ["-Wno-error"]

