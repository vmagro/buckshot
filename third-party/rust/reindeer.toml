##
## Reindeer config for buckshot's Rust third-party crates.
##
## Lives alongside `Cargo.toml`/`Cargo.lock`/`BUCK` the same way
## `third-party/npm/` holds its own npm equivalents -- this file marks the
## top of the reindeer-managed directory, so `third_party_dir = "."` writes
## output back into this same directory.
##

third_party_dir = "."
precise_srcs = true

[buck]
file_name = "BUCK"

rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
cxx_library = "cxx_library"
prebuilt_cxx_library = "prebuilt_cxx_library"

buckfile_imports = """
load("@prelude//:rules.bzl", "cxx_library", "prebuilt_cxx_library")
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""

generated_file_header = """
# @generated by reindeer from third-party/rust/Cargo.toml.
# Do not edit by hand -- see third-party/rust/README.md to regenerate.
"""
