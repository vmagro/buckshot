##
## Reindeer config for buckshot's Rust third-party crates.
##
## Lives alongside `Cargo.toml`/`Cargo.lock`/`BUCK` the same way
## `third-party/npm/` holds its own npm equivalents -- this file marks the
## top of the reindeer-managed directory, so `third_party_dir = "."` writes
## output back into this same directory.
##

third_party_dir = "."
precise_srcs = true

[buck]
file_name = "BUCK"

rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
cxx_library = "cxx_library"
prebuilt_cxx_library = "prebuilt_cxx_library"

buckfile_imports = """
load("@prelude//:rules.bzl", "cxx_library", "prebuilt_cxx_library")
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""

generated_file_header = """
# @generated by reindeer from third-party/rust/Cargo.toml.
# Do not edit by hand -- see third-party/rust/README.md to regenerate.
"""

## Windows ARM64 platforms (reindeer's defaults are x86_64-only for
## Windows). The gnu flavor targets `aarch64-pc-windows-gnullvm` -- rustup
## ships no classic `aarch64-pc-windows-gnu` -- whose `target_env` is still
## `gnu`, so `target_env = "gnu"` fixup cfgs match it. The buck-side
## `set_reindeer_platforms` override in `third-party/rust/PACKAGE` maps
## `windows+arm64` configs to these names (reindeer's default mapping is
## OS+ABI only for Windows, collapsing both arches onto `windows-gnu` /
## `windows-msvc`).
[platform.windows-arm64-gnu]
target = "aarch64-pc-windows-gnullvm"

[platform.windows-arm64-msvc]
target = "aarch64-pc-windows-msvc"

## Unix + Windows x86_64 platforms. Current reindeer only evaluates
## target-gated deps and cfg-gated fixups against Windows (+ custom)
## platforms: without these, unix-only deps (e.g. getrandom's libc) and
## non-ARM64 slices (e.g. ring's x86 asm) are silently dropped from the
## output. Names match `DEFAULT_REINDEER_PLATFORMS`, so the PACKAGE
## mapping needs no changes.
[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[platform.macos-arm64]
target = "aarch64-apple-darwin"

[platform.macos-x86_64]
target = "x86_64-apple-darwin"

[platform.windows-gnu]
target = "x86_64-pc-windows-gnu"

[platform.windows-msvc]
target = "x86_64-pc-windows-msvc"
