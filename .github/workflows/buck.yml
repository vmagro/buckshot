name: Buck

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      patterns:
        description: 'Target patterns to test (space-separated, e.g. "tests//rust/..."). Empty tests everything affected.'
        required: false
        default: ''
        type: string

jobs:
  buck:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up buck2
      uses: ./actions/setup
    - name: Test affected targets
      uses: ./actions/buck-test
      with:
        # build buckshot from source so we can test it before building a new
        # release version
        buckshot-target: buckshot//buckshot:buckshot
        # Manual runs (Run workflow button, `gh workflow run --field`)
        # test an explicit set; push/PR events leave this empty and test
        # whatever is affected.
        always-patterns: ${{ inputs.patterns }}

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: facebook/install-dotslash@latest
    - name: check starlark formatting
      # Dotslash directly (no buck2 run): tools/buck/starlark_fmt is the
      # release's dotslash manifest, refreshed by `buck2 run //buckshot -- buck update`.
      # (The prelude is a bundled external cell, so no vendored sources
      # need excluding here.)
      run: |
        files=$(git ls-files | grep -E '(^|/)(BUCK|[^/]+\.bzl)$')
        ./tools/buck/starlark_fmt --config tools/buck/starlark_fmt.json fmt $files
        git diff --exit-code
