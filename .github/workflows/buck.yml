name: Buck

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      patterns:
        description: 'Target patterns to test and clippy (space-separated, e.g. "tests//rust/..."). Empty covers everything affected.'
        required: false
        default: ''
        type: string

jobs:
  buck:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up buck2
      uses: ./actions/setup
    - name: Test affected targets
      uses: ./actions/buck-test
      with:
        # build buckshot from source so we can test it before building a new
        # release version
        buckshot-target: buckshot//buckshot:buckshot
        # Skip targets incompatible with the runner platform (e.g.
        # Windows-only vendored C targets in the affected set): they
        # cannot build here, and their absence is not a regression.
        test-args: --skip-incompatible-targets
        # Manual runs (Run workflow button, `gh workflow run --field`)
        # test an explicit set; push/PR events leave this empty and test
        # whatever is affected.
        always-patterns: ${{ inputs.patterns }}
    # Prune before the setup action's cache save (a post-step): without
    # this the shared store grows without bound across runs. The daemon
    # must be stopped first (the pruner walks files directly). Last step
    # on purpose: nothing builds after this.
    - name: Prune reapid store to this job's working set
      if: always()
      run: |
        set -euo pipefail
        if [ ! -f "$RUNNER_TEMP/reapid.pid" ]; then
          echo "no reapid daemon ran; nothing to prune"
          exit 0
        fi
        kill "$(cat "$RUNNER_TEMP/reapid.pid")" 2>/dev/null || true
        for _ in $(seq 1 50); do kill -0 "$(cat "$RUNNER_TEMP/reapid.pid")" 2>/dev/null || break; sleep 0.1; done
        # The pinned CLI only learns `reapid prune` at the next release;
        # skip (without failing) until the refresh lands.
        if ./tools/buckshot/stable reapid prune --help >/dev/null 2>&1; then
          du -sh "$RUNNER_TEMP/reapid-store"
          ./tools/buckshot/stable reapid prune --store-dir "$RUNNER_TEMP/reapid-store"
        else
          echo "pinned buckshot predates 'reapid prune'; skipping"
        fi

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up buck2
      uses: ./actions/setup
    - id: changed
      name: Detect affected targets
      uses: ./actions/changed-targets
      with:
        # build buckshot from source so we can test it before building a new
        # release version
        buckshot-target: buckshot//buckshot:buckshot
        # Clippy only first-party code: vendored third-party crates live
        # in the root cell (unlike consumers that isolate them in their
        # own cell), so exclude them by path. Vendored code is out of
        # our control -- and Windows-only crates fail to even compile
        # their clippy diagnostics on this Linux runner.
        exclude-patterns: buckshot//third-party/...
        # Manual runs (Run workflow button, `gh workflow run --field`)
        # clippy an explicit set; push/PR events leave this empty and
        # clippy whatever is affected.
        if-changed-patterns: ${{ inputs.patterns }}
    - name: Clippy affected rust targets
      uses: ./rust/clippy
      with:
        # build buckshot from source so we can test it before building a new
        # release version
        buckshot-target: buckshot//buckshot:buckshot
        targets: ${{ steps.changed.outputs.targets }}
    # Prune before the setup action's cache save (a post-step): without
    # this the shared store grows without bound across runs. The daemon
    # must be stopped first (the pruner walks files directly). Last step
    # on purpose: nothing builds after this.
    - name: Prune reapid store to this job's working set
      if: always()
      run: |
        set -euo pipefail
        if [ ! -f "$RUNNER_TEMP/reapid.pid" ]; then
          echo "no reapid daemon ran; nothing to prune"
          exit 0
        fi
        kill "$(cat "$RUNNER_TEMP/reapid.pid")" 2>/dev/null || true
        for _ in $(seq 1 50); do kill -0 "$(cat "$RUNNER_TEMP/reapid.pid")" 2>/dev/null || break; sleep 0.1; done
        # The pinned CLI only learns `reapid prune` at the next release;
        # skip (without failing) until the refresh lands.
        if ./tools/buckshot/stable reapid prune --help >/dev/null 2>&1; then
          du -sh "$RUNNER_TEMP/reapid-store"
          ./tools/buckshot/stable reapid prune --store-dir "$RUNNER_TEMP/reapid-store"
        else
          echo "pinned buckshot predates 'reapid prune'; skipping"
        fi

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: facebook/install-dotslash@latest
    - name: check starlark formatting
      # Dotslash directly (no buck2 run): tools/buck/starlark_fmt is the
      # release's dotslash manifest, refreshed by `buck2 run //buckshot -- buck update`.
      # (The prelude is a bundled external cell; only vendored sources under
      # third-party/rust need excluding here.)
      run: |
        files=$(git ls-files | grep -E '(^|/)(BUCK|[^/]+\.bzl)$' | grep -v '^third-party/rust/')
        ./tools/buck/starlark_fmt --config tools/buck/starlark_fmt.json fmt $files
        git diff --exit-code
