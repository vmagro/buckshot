name: Buck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  buck:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: facebook/install-dotslash@latest
    # actions/cache only saves on key miss, so the key ends in github.sha to
    # force a save every run; restore-keys fall back to the newest cache for
    # the same OS + buck2 version (./buck2 changes on every update_buck.py run,
    # and buck2 + prelude move together). buck-out/ is not portable across
    # OSes, hence the runner.os prefix.
    - uses: actions/cache@v6
      with:
        path: buck-out/
        key: buck-out-${{ runner.os }}-${{ hashFiles('buck2') }}-${{ github.sha }}
        restore-keys: |
          buck-out-${{ runner.os }}-${{ hashFiles('buck2') }}-
          buck-out-${{ runner.os }}-
    - name: buck2 test tests//...
      run: ./buck2 test tests//...

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: facebook/install-dotslash@latest
    - name: check starlark formatting
      # Dotslash directly (no buck2 run): tools/buck/starlark_fmt is the
      # release's dotslash manifest, refreshed by tools/update_buck.py.
      # (The prelude is a bundled external cell, so no vendored sources
      # need excluding here.)
      run: |
        files=$(git ls-files | grep -E '(^|/)(BUCK|[^/]+\.bzl)$')
        ./tools/buck/starlark_fmt --config tools/buck/starlark_fmt.json fmt $files
        git diff --exit-code
