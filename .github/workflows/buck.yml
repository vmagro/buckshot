name: Buck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  buck:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: facebook/install-dotslash@latest
    - name: buck2 test tests//...
      run: ./buck2 test tests//...

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: facebook/install-dotslash@latest
    - name: check starlark formatting
      # Dotslash directly (no buck2 run): tools/buck/starlark_fmt is the
      # release's dotslash manifest, refreshed by tools/update_buck.py.
      # buck2-prelude/ is vendored upstream and stays unformatted.
      run: |
        files=$(git ls-files | grep -E '(^|/)(BUCK|[^/]+\.bzl)$' | grep -v '^buck2-prelude/')
        ./tools/buck/starlark_fmt --config tools/buck/starlark_fmt.json fmt $files
        git diff --exit-code
