name: Buck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  buck:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: facebook/install-dotslash@latest
    - name: build buckshot-nativelink container
      # See platforms/exec/README.md -- plain Docker, native to this
      # runner's (amd64) arch, no --platform/--build-arg needed.
      run: docker build -t buckshot-nativelink -f platforms/exec/Dockerfile .
    - name: start buckshot-nativelink container
      run: |
        docker run -d --name buckshot-nativelink \
          -p 50051:50051 -p 50061:50061 buckshot-nativelink
    - name: buck2 test tests//...
      run: ./buck2 test --prefer-remote tests//...

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: facebook/install-dotslash@latest
    - name: check starlark formatting
      # No docker/NativeLink container needed: the formatter is a host
      # tool, so its actions run on the local execution platform.
      # buck2-prelude/ is vendored upstream and stays unformatted.
      run: |
        files=$(git ls-files | grep -E '(^|/)(BUCK|[^/]+\.bzl)$' | grep -v '^buck2-prelude/')
        ./buck2 run //tools/buck:starlark_fmt -- --config tools/buck/starlark_fmt.json fmt $files
        git diff --exit-code
