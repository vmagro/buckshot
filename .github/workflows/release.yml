name: CLI release

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    # One Linux runner builds every platform: buckshot's toolchains
    # cross-compile (rustc --target + zig cc -target), so Windows and
    # macOS need no native runners. (Windows-host builds can't work
    # anyway: raw-dylib crates need dlltool shims the toolchain only
    # provisions on POSIX hosts. See rust/toolchain/rust_dist.bzl.)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: facebook/install-dotslash@latest
      # actions/cache only saves on key miss, so the key ends in github.sha to
      # force a save every run; restore-keys fall back to the newest cache for
      # the same OS + buck2 version (./buck2 changes on every `buck update` run,
      # and buck2 + prelude move together). buck-out/ is not portable across
      # OSes, hence the runner.os prefix.
      - uses: actions/cache@v6
        with:
          path: buck-out/
          key: buck-out-${{ runner.os }}-${{ hashFiles('buck2') }}-${{ github.sha }}
          restore-keys: |
            buck-out-${{ runner.os }}-${{ hashFiles('buck2') }}-
            buck-out-${{ runner.os }}-
      - name: build all platforms
        run: |
          OUT_DIR=$(./buck2 bxl buckshot//scripts/build.bxl:build -- --exe buckshot//buckshot:buckshot)
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          ls -l "$OUT_DIR"
      - name: create release + upload
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" "$OUT_DIR"/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: dotslash manifest
        uses: facebook/dotslash-publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .github/workflows/dotslash-config.json
          tag: ${{ github.ref_name }}
