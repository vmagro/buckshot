name: CLI release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    # One Linux runner builds every platform: buckshot's toolchains
    # cross-compile (rustc --target + zig cc -target), so Windows and
    # macOS need no native runners. (Windows-host builds can't work
    # anyway: raw-dylib crates need dlltool shims the toolchain only
    # provisions on POSIX hosts. See rust/toolchain/rust_dist.bzl.)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup
      - name: build all platforms
        run: |
          OUT_DIR=$(./buck2 bxl buckshot//scripts/build.bxl:build -- --exe buckshot//buckshot:buckshot)
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          ls -l "$OUT_DIR"
      - name: create release + upload
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" "$OUT_DIR"/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dotslash:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Sparse checkout: dotslash-publish-release writes its `buckshot`
      # output file to the workspace root, which would collide with the
      # repo's own `buckshot/` directory in a full checkout. (It reads
      # the config via the API, so nothing else is needed locally.)
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      # The action uploads without --clobber, so drop a previous
      # manifest first to keep re-runs green. Absence is fine.
      - name: delete stale manifest
        run: |
          gh release delete-asset "${{ github.ref_name }}" buckshot --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: dotslash manifest
        uses: facebook/dotslash-publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .github/workflows/dotslash-config.json
          tag: ${{ github.ref_name }}

  vendor-dotslash:
    needs: dotslash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: refresh vendored manifest
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/vendor-dotslash
          mkdir -p /tmp/vendor-dotslash
          gh release download "$TAG" --pattern buckshot --dir /tmp/vendor-dotslash --clobber
          MANIFEST=/tmp/vendor-dotslash/buckshot
          head -n 1 "$MANIFEST" | grep -qx '#!/usr/bin/env dotslash'
          grep -q "/${TAG}/" "$MANIFEST"

          install -m755 "$MANIFEST" tools/buckshot/stable
          if git diff --quiet -- tools/buckshot/stable; then
            echo "tools/buckshot/stable already current for $TAG"
            exit 0
          fi

          git add tools/buckshot/stable
          git commit -m "Refresh vendored buckshot CLI manifest to ${TAG}"

          # Push straight to main (no PR): main is unprotected. If it
          # moved under us, rebase onto the new tip and retry. Never
          # force-push main.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase "origin/main"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "failed to push to main after 3 attempts" >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
