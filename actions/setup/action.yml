name: buckshot setup
description: Install dotslash and share the buck-out/ build cache across runs.

inputs:
  cache:
    description: Whether to restore and save the buck-out/ cache.
    required: false
    default: 'true'
  buck2-wrapper:
    description: Repo-relative path of the dotslash buck2 wrapper, used for the cache key (buck2 and the prelude move together).
    required: false
    default: 'buck2'

runs:
  using: composite
  steps:
    - uses: facebook/install-dotslash@latest
    # actions/cache only saves on key miss, so the key ends in github.sha to
    # force a save every run; restore-keys fall back to the newest cache for
    # the same OS + buck2 version. buck-out/ is not portable across OSes,
    # hence the runner.os prefix.
    - if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: buck-out/
        key: buck-out-${{ runner.os }}-${{ hashFiles(inputs.buck2-wrapper) }}-${{ github.sha }}
        restore-keys: |
          buck-out-${{ runner.os }}-${{ hashFiles(inputs.buck2-wrapper) }}-
          buck-out-${{ runner.os }}-
