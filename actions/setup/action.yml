name: buckshot setup
description: Install dotslash and share the buck-out/ build cache across runs.

inputs:
  cache:
    description: Whether to restore and save the buck-out/ cache.
    required: false
    default: 'true'
  buck2-wrapper:
    description: Repo-relative path of the dotslash buck2 wrapper, used for the cache key (buck2 and the prelude move together).
    required: false
    default: 'buck2'
  reapid:
    description: >-
      Start a local `reapid` shared-cache daemon in the background (via the
      pinned buckshot CLI) and point buck2 at it through `.buckconfig.local`.
      The daemon's store is shared across jobs through the cache. The pinned
      CLI must be a release that includes `reapid` -- otherwise this step
      fails. Set to 'false' when the job manages its own daemon lifecycle
      (e.g. cache-population flows that start a daemon with a custom store).
    required: false
    default: 'true'
  buckshot:
    description: Repo-relative path of the pinned buckshot dotslash manifest used to run `reapid`.
    required: false
    default: 'tools/buckshot/stable'

runs:
  using: composite
  steps:
    # TEMPORARY HACK until buck2 cuts a dated release new enough for
    # get_root_cell_name: the `latest` tag moves under the pinned manifest
    # (dotslash fails closed on the hash mismatch), so bypass dotslash in
    # CI and drop the live binary straight onto the wrapper path. Only
    # wrappers already tracking `latest` are replaced -- dated pins are
    # left alone. No integrity check beyond TLS: delete this step (and
    # re-pin ./buck2) once the dated release lands.
    - name: Refresh buck2 to live latest (temporary)
      shell: bash
      run: |
        set -euo pipefail
        wrapper='${{ inputs.buck2-wrapper }}'
        grep -q 'releases/download/latest' "$wrapper" || exit 0
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) asset=buck2-x86_64-unknown-linux-musl.zst ;;
          Linux-ARM64) asset=buck2-aarch64-unknown-linux-musl.zst ;;
          macOS-X64) asset=buck2-x86_64-apple-darwin.zst ;;
          macOS-ARM64) asset=buck2-aarch64-apple-darwin.zst ;;
          Windows-X64) asset=buck2-x86_64-pc-windows-msvc.exe.zst ;;
          Windows-ARM64) asset=buck2-aarch64-pc-windows-msvc.exe.zst ;;
          *) echo "::error::buck2 refresh hack: unsupported ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        command -v unzstd >/dev/null || { echo "::error::buck2 refresh hack: unzstd not found"; exit 1; }
        curl -sSL --fail -o "$RUNNER_TEMP/buck2.zst" "https://github.com/facebook/buck2/releases/download/latest/${asset}"
        unzstd -f "$RUNNER_TEMP/buck2.zst" -o "$wrapper"
        chmod +x "$wrapper"
    - uses: facebook/install-dotslash@latest
    - name: Add buck2 to PATH
      shell: bash
      run: |
        mkdir -p $RUNNER_TEMP/bin
        ln -s "$GITHUB_WORKSPACE/${{ inputs.buck2-wrapper }}" "$RUNNER_TEMP/bin/buck2"
        echo "$RUNNER_TEMP/bin" >> $GITHUB_PATH
    # actions/cache only saves on key miss, so the key ends in github.sha to
    # force a save every run; restore-keys fall back to the newest cache for
    # the same OS + buck2 version. buck-out/ is not portable across OSes,
    # hence the runner.os prefix.
    - if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: buck-out/
        key: buck-out-${{ runner.os }}-${{ hashFiles(inputs.buck2-wrapper) }}-${{ github.sha }}
        restore-keys: |
          buck-out-${{ runner.os }}-${{ hashFiles(inputs.buck2-wrapper) }}-
          buck-out-${{ runner.os }}-
    # The `reapid` store lives across jobs through the cache (restored
    # here, before the daemon below opens it; saved in the action's
    # post-job step). Same key shape as buck-out/: OS + buck2 version,
    # plus the pinned buckshot manifest (the daemon owning the store
    # format moves with it).
    - if: inputs.reapid == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/reapid-store
        key: reapid-store-${{ runner.os }}-${{ hashFiles(inputs.buck2-wrapper, inputs.buckshot) }}-${{ github.sha }}
        restore-keys: |
          reapid-store-${{ runner.os }}-${{ hashFiles(inputs.buck2-wrapper, inputs.buckshot) }}-
          reapid-store-${{ runner.os }}-
    # Prune the restored store before this job's daemon starts (long before
    # the cache save, which is this action's post-job step): `reapid prune`
    # defaults `--since` to the `.reapid-birth` marker the previous run's
    # daemon left in the cached store, so this drops exactly what an
    # end-of-previous-run prune would have dropped and the uploaded store
    # stays bounded instead of growing without bound. A composite action
    # has no post-job hook, so this setup-time pass -- not a step after the
    # builds -- is what centralizes pruning for every consumer (workflows
    # may still prune after stopping the daemon for a tighter upload; see
    # buck.yml). Safe: no daemon runs yet on a fresh runner (the pruner
    # walks files directly and must not race a live index), and a fresh
    # store has no birth marker to prune against.
    - if: inputs.reapid == 'true'
      name: Prune reapid store to the previous working set
      shell: bash
      run: |
        set -euo pipefail
        store="$RUNNER_TEMP/reapid-store"
        buckshot_bin='${{ inputs.buckshot }}'
        if [ ! -f "$store/.reapid-birth" ]; then
          echo "no previous reapid store; nothing to prune"
          exit 0
        fi
        # The pinned CLI only learns `reapid prune` at the next release;
        # skip (without failing) until the refresh lands.
        if ! "$buckshot_bin" reapid prune --help >/dev/null 2>&1; then
          echo "pinned buckshot predates 'reapid prune'; skipping"
          exit 0
        fi
        du -sh "$store"
        "$buckshot_bin" reapid prune --store-dir "$store"
    # A local `reapid` shared cache: actions still execute on the build
    # host while results flow through the daemon's store, so warm state
    # survives `buck2 clean` and daemon restarts within the job -- and,
    # through the cache above, across jobs. Runs the pinned prebuilt CLI
    # (dotslash is on PATH from the step above), not `buck2 run`, so no
    # daemon needs to exist yet. The buck2 daemon reads `.buckconfig.local`
    # at startup, and no buck2 invocation precedes this step on a fresh
    # runner, so writing it here is enough. A pinned CLI without `reapid`
    # fails here: refresh it with `buckshot update <tag>`.
    - if: inputs.reapid == 'true'
      name: Start local reapid shared cache
      shell: bash
      run: |
        set -euo pipefail
        buckshot_bin='${{ inputs.buckshot }}'
        store="$RUNNER_TEMP/reapid-store"
        config="$RUNNER_TEMP/reapid.toml"
        log="$RUNNER_TEMP/reapid.log"
        mkdir -p "$store"
        cat > "$config" <<EOF
        bind = "127.0.0.1:50051"
        store_dir = "$store"

        [[backends]]
        name = "local"
        endpoint = "self"
        EOF
        echo "--- starting reapid on 127.0.0.1:50051 (pinned $buckshot_bin)"
        RUST_LOG=info,reapi_cache=debug "$buckshot_bin" reapid --config "$config" > "$log" 2>&1 &
        echo $! > "$RUNNER_TEMP/reapid.pid"
        # Intentionally no trap: the daemon must outlive this step and
        # serve every later buck2 invocation in the job (the runner is
        # ephemeral, so no cleanup is needed).
        for _ in $(seq 1 50); do
          grep -q "serving REAPI" "$log" 2>/dev/null && break
          sleep 0.1
        done
        grep -q "serving REAPI" "$log" || {
          echo "::error::reapid never came up" >&2
          tail -30 "$log" >&2
          exit 1
        }
        # Point buck2 at the daemon. Prefer the shared partial config when
        # this repo's layout is checked out (single source of truth);
        # otherwise inline the same client snippet so consumers whose
        # buckshot cell lives in a subdirectory need no path override.
        if [ -f 'remote_execution/reapid/reapid.buckconfig' ]; then
          include='<file:remote_execution/reapid/reapid.buckconfig>'
          if ! grep -qF "$include" .buckconfig.local 2>/dev/null; then
            printf '%s\n' "$include" >> .buckconfig.local
          fi
        elif ! grep -q 'action_cache_address' .buckconfig.local 2>/dev/null; then
          cat >> .buckconfig.local <<'EOF'
        [build]
        execution_platforms = buckshot//remote_execution/reapid/platform:platform

        [buck2_re_client]
        action_cache_address = grpc://127.0.0.1:50051
        cas_address = grpc://127.0.0.1:50051
        engine_address = grpc://127.0.0.1:50051
        tls = false
        EOF
        fi
        echo "reapid is up; buck2 will use it via .buckconfig.local"
